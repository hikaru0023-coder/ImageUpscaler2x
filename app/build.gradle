plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.imageupscaler2x'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.imageupscaler2x'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
